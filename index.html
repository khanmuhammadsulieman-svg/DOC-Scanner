<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#b91c1c">
  <meta name="author" content="Sulieman Khan">
  <meta name="description" content="DocSpace Office — a browser-based document reader/editor for PDF, Word, Excel, TXT and HTML files. Built by Sulieman Khan.">
  <title>DocSpace — Office</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand">
        <div class="logo">D</div>
        <div>
          <div class="brand-name">DocSpace</div>
          <div class="brand-sub">Office</div>
        </div>
      </div>
      <div class="top-actions">
        <button class="icon-btn" id="themeBtn" title="Toggle theme">☾</button>
        <button class="avatar">S</button>
      </div>
    </header>

    <main class="home" id="homeView">
      <section class="hero">
        <div>
          <h1>Good day.</h1>
          <p>Create, read and edit documents — PDF, Word, Excel, TXT and HTML — right in your browser.</p>
        </div>
        <div class="hero-actions">
          <button class="primary" id="newDocBtn">＋ New document</button>
          <button class="secondary" id="openFileBtn">Open file</button>
          <input type="file" id="fileInput" hidden accept=".txt,.html,.htm,.pdf,.docx,.xlsx,.xls,.csv">
        </div>
      </section>

      <section class="quick-grid">
        <button class="quick-card" id="blankBtn">
          <span class="quick-icon word">W</span>
          <span><b>Blank document</b><small>Start writing from scratch</small></span>
        </button>
        <button class="quick-card" id="notesBtn">
          <span class="quick-icon notes">N</span>
          <span><b>Quick notes</b><small>Open a simple notes page</small></span>
        </button>
      </section>

      <section class="recent-section">
        <div class="section-head">
          <h2>Recent documents</h2>
          <button class="text-btn" id="clearRecentBtn">Clear</button>
        </div>
        <div id="recentList" class="recent-list"></div>
      </section>

      <footer class="app-footer">
        <span>DocSpace Office · Built by <strong>Sulieman Khan</strong></span>
      </footer>
    </main>

    <main class="editor-view hidden" id="editorView">
      <div class="editor-head">
        <button class="back-btn" id="backBtn" title="Back">←</button>
        <div class="doc-title-wrap">
          <input id="docTitle" value="Untitled Document">
          <span id="saveState">Saved</span>
        </div>
        <span id="wordCount" class="word-count">0 words</span>
        <button class="primary small" id="saveBtn">Save</button>
      </div>

      <div class="toolbar">
        <button data-cmd="undo" title="Undo">↶</button>
        <button data-cmd="redo" title="Redo">↷</button>
        <span class="divider"></span>
        <select id="formatBlock" title="Paragraph style">
          <option value="p">Normal</option>
          <option value="h1">Heading 1</option>
          <option value="h2">Heading 2</option>
          <option value="h3">Heading 3</option>
        </select>
        <select id="fontSize" title="Font size">
          <option value="2">12</option>
          <option value="3" selected>16</option>
          <option value="4">18</option>
          <option value="5">24</option>
          <option value="6">32</option>
          <option value="7">40</option>
        </select>
        <button data-cmd="bold" title="Bold"><b>B</b></button>
        <button data-cmd="italic" title="Italic"><i>I</i></button>
        <button data-cmd="underline" title="Underline"><u>U</u></button>
        <span class="divider"></span>
        <button data-cmd="justifyLeft" title="Align left">≡</button>
        <button data-cmd="justifyCenter" title="Align center">≡</button>
        <button data-cmd="justifyRight" title="Align right">≡</button>
        <button data-cmd="insertUnorderedList" title="Bulleted list">• List</button>
        <button data-cmd="insertOrderedList" title="Numbered list">1. List</button>
        <span class="divider"></span>
        <button id="printBtn" title="Print">Print</button>
        <button id="downloadBtn" title="Download as HTML">Download HTML</button>
      </div>

      <div class="workspace">
        <div class="page" id="editor" contenteditable="true" spellcheck="true">
          <p>Start writing here...</p>
        </div>
      </div>
    </main>

    <main class="reader-view hidden" id="readerView">
      <div class="reader-toolbar">
        <button class="back-btn" id="readerBack" title="Back">←</button>
        <strong id="readerTitle">Document</strong>
        <span id="readerMeta" class="reader-meta"></span>
        <button class="secondary small" id="readerEditBtn">Edit</button>
        <button class="secondary small" id="printBtnReader">Print</button>
        <button class="primary small" id="readerDownload">Download</button>
      </div>
      <div class="reader-body">
        <aside class="reader-sidebar hidden" id="readerSidebar"></aside>
        <div id="readerContent" class="reader-content"></div>
      </div>
    </main>

    <div class="toast" id="toast"></div>
  </div>

  <!-- Document parsing libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

  <script src="app.js"></script>
</body>
</html>
